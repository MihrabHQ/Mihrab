name: Reuse check

# Weekly look for forks, copies or republications of this codebase.
# Runs on GitHub so it does not depend on any machine being switched on.
# Opens an issue AND emails when something changes; stays silent otherwise.
#
# Email uses the same secrets as the dataset jobs (MAIL_SERVER, MAIL_PORT,
# MAIL_USERNAME, MAIL_PASSWORD). If they are unset the job still runs and still
# opens the issue; only the mail step is skipped.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: read
  issues: write
# NOTE: clone traffic cannot be unlocked here. It is an Administration-read
# endpoint, and `administration` is not one of the keys this block accepts —
# GitHub rejects the whole workflow with a 422 if you try. It needs a PAT in
# the MIHRAB_WATCH_TOKEN secret (fine-grained, this repo only, Administration:
# read is enough). Forks and code search both work on the default token, as of
# the 2026-07-31 run.
#
# So this job does NOT expect the clone count, and its absence is not a
# finding — #28, where the check spent its Mondays opening an issue about its
# own token. If the secret is ever added the reading comes back on its own and
# the clone-spike alert starts working again; nothing here has to change.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The baseline is what makes this report only CHANGES. Without it every
      # run would restate the same numbers and the report would stop being
      # read. The rolling restore-key picks up the most recent previous run.
      - name: Restore previous baseline
        uses: actions/cache/restore@v4
        with:
          path: ~/.mihrab-watch-baseline.json
          key: mihrab-watch-${{ github.run_id }}
          restore-keys: mihrab-watch-

      - name: Run the check
        id: check
        env:
          # A PAT in MIHRAB_WATCH_TOKEN gets a working code search; the default
          # GITHUB_TOKEN cannot always use the code-search API. The script
          # degrades gracefully either way, so this secret is optional.
          GH_TOKEN: ${{ secrets.MIHRAB_WATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT=$(bash scripts/mihrab-watch.sh 2>&1)
          echo "$OUT"
          {
            echo 'report<<REPORT_EOF'
            echo "$OUT"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          if echo "$OUT" | grep -q 'no change'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.mihrab-watch-baseline.json
          key: mihrab-watch-${{ github.run_id }}

      - name: Open an issue if something changed
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          # Built with printf, not a heredoc: a heredoc body has to start at
          # column 0, which ends the YAML block scalar and makes the whole
          # workflow unparseable.
          {
            printf 'The weekly reuse check found a change. Most changes are harmless — an\n'
            printf 'F-Droid index mirror, a package-name dataset used in security research,\n'
            printf 'or an unrelated app that happens to share the `com.prayer_times` package\n'
            printf 'id have all turned up before. Copied source is not harmless.\n\n'
            printf '%s\n\n' "$REPORT"
            printf -- '---\n'
            printf 'If it is a real copy: the name and icon are not licensed (see\n'
            printf 'TRADEMARK.md), which makes a branding complaint to Google Play or the\n'
            printf 'App Store the fastest route — no licence argument required.\n'
          } > issue-body.md
          gh issue create \
            --title "Reuse check: something changed ($(date -u +%Y-%m-%d))" \
            --body-file issue-body.md

      # Same channel the dataset jobs use, so alerts from this repo all
      # arrive the same way. The issue is the durable record; this is the nudge
      # that makes it get read.
      - name: Email if something changed
        if: steps.check.outputs.changed == 'true' && env.MAIL_SERVER != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Mihrab Reuse Watch <${{ secrets.MAIL_USERNAME }}>
          to: mihrab@elghamri.se
          subject: '[Mihrab] Reuse check: something changed'
          body: |
            The weekly reuse check found a change since the last run.

            Most changes are harmless — an F-Droid index mirror, a package-name
            dataset used in security research, or an unrelated app that happens
            to share the com.prayer_times package id have all turned up before.
            Copied source is not harmless.

            ${{ steps.check.outputs.report }}

            If it is a real copy: the name and icon are not licensed (see
            TRADEMARK.md), which makes a branding complaint to Google Play or
            the App Store the fastest route — no licence argument required.
            ~/.mihrab-provenance.md holds the markers that prove origin.

            Issue + full log:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # A monitor that dies quietly is worse than no monitor: the silence reads
      # as "nothing found". This makes a broken check as loud as a finding.
      - name: Email if the check itself failed
        if: failure() && env.MAIL_SERVER != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Mihrab Reuse Watch <${{ secrets.MAIL_USERNAME }}>
          to: mihrab@elghamri.se
          subject: '[Mihrab] Reuse check FAILED'
          body: |
            The weekly reuse check did not complete, so this week nothing was
            actually checked. Treat it as "unknown", not as "all clear".

            Usual causes:
              • the GitHub API refused a call (token scope or rate limit), or
              • the baseline cache could not be read or written, or
              • gh is no longer authenticated in the runner.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

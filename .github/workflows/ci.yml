name: CI

# Runs the JS test suite + TypeScript typecheck on every push and PR.
# Previously there was no CI, so the Jest suite could (and did) drift red
# without anyone noticing — this workflow makes `npx jest` a merge gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NO `cancel-in-progress` HERE, unlike the build workflows. The release
# reads this workflow's last COMPLETED run on main and stops on anything
# but success (scripts/release/preflight.ts, P10) — and a run cancelled
# because a newer push replaced it is a completed run that is not a
# success. Each push's run is short enough to be left to finish.

jobs:
  # EVERY JOB HAS A TIME LIMIT. Without one a job runs until GitHub's own
  # six hours, and on 2026-11-10 a test that never finished did exactly
  # that on every push for a day — twenty runners held, every other
  # workflow queueing behind them, and "cancelled" where a red X should
  # have been (see __tests__/todayMinimal.test.tsx).
  test:
    name: test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The runner is UTC, which has no daylight saving — so a date
        # counted in multiples of 24 hours looks right there and is a day
        # off in most of the places Mihrab is used. Three khatmah dates
        # were (2026-09-29, __tests__/khatmahClockChange.test.ts). So the
        # suite runs where the clocks do move as well — beside the UTC
        # run, not after it: one after the other they took 24 minutes.
        tz: [UTC, Europe/Stockholm]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint (errors)
        run: npm run lint:errors

      # The runner's cores, not one of them: `--runInBand` took sixteen
      # minutes for what the same machine does in a third of that.
      - name: Jest
        run: npx jest --ci --maxWorkers=100%

  # The widget contract (docs/rewrite-plan.md, Phase 1): the readers the
  # widgets and Live Activities compile, run over the golden fixtures the
  # app's own TypeScript wrote (contract-tests/fixtures.json). A payload
  # change one platform reads differently from the app fails here. Neither
  # job needs an Xcode project or the Android build — the contract code
  # depends on Foundation and org.json only. Swift runs on macOS so it gets
  # Apple's Foundation, the one the widgets link, rather than Linux's.
  contract-swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Swift readers against the fixtures
        run: scripts/contract-test-native.sh swift

  contract-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Kotlin readers against the fixtures
        run: scripts/contract-test-native.sh kotlin

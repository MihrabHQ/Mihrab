name: Kemenag probe

# Does a runner reach bimasislam.kemenag.go.id at all? From Sweden the site
# does not answer (the connection times out), which looks like a geographic
# block. If a runner gets through, Indonesia's table can be built the way
# Malaysia's is; if not, it needs a different source. Run by hand, commits
# nothing, is not scheduled.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reach the page and the city list
        run: |
          set -x
          curl -sS -m 40 -c jar.txt -A 'Mihrab dataset builder (+https://github.com/MihrabHQ/Mihrab; mihrab@elghamri.se)' \
            -o page.html -w 'page %{http_code} %{time_total}s\n' https://bimasislam.kemenag.go.id/jadwalshalat || echo 'page: no answer'
          ls -la page.html 2>/dev/null && grep -o 'id="search_prov"' page.html | head -1 && \
            grep -o '<option value="[0-9a-f]\{32\}">[^<]*' page.html | head -5
          PROV=$(grep -o '<option value="[0-9a-f]\{32\}">[^<]*' page.html | head -1 | sed 's/.*value="\([0-9a-f]*\)".*/\1/')
          [ -n "$PROV" ] && curl -sS -m 40 -b jar.txt -A 'Mihrab dataset builder' -X POST -d "x=$PROV" \
            -w 'cities %{http_code}\n' https://bimasislam.kemenag.go.id/ajax/getKabkoshalat | head -c 600
          echo
          KAB=$(curl -sS -m 40 -b jar.txt -A 'Mihrab dataset builder' -X POST -d "x=$PROV" https://bimasislam.kemenag.go.id/ajax/getKabkoshalat | grep -o 'value="[0-9a-f]\{32\}"' | head -1 | sed 's/value="//;s/"//')
          [ -n "$KAB" ] && curl -sS -m 40 -b jar.txt -A 'Mihrab dataset builder' -X POST \
            -d "x=$PROV&y=$KAB&bln=10&thn=2026" -w 'month %{http_code}\n' https://bimasislam.kemenag.go.id/ajax/getShalatbln | head -c 800

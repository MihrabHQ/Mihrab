name: Accuracy figures

# The site, the README and the store listings quote mihrab-methods'
# certification record through a committed copy (data/methods/
# certification.json). Every day this syncs the copy from mihrab-methods'
# main, regenerates everything that quotes it, and — when a figure changed —
# opens (or refreshes) one pull request, so every change to a published
# figure is reviewed before it goes out. Releases sync too (scripts/release.sh).
#
# A pull request opened with the workflow's token does not start other
# workflows, so this job runs the same checks CI would for these files
# before it opens one: the site and the copy are current and within every
# store limit.

on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: accuracy-figures
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync the record and regenerate
        run: |
          node scripts/copy/sync-certification.js https://raw.githubusercontent.com/MihrabHQ/mihrab-methods/main
          node scripts/build-site.js >/dev/null
          node scripts/build-copy.js >/dev/null
          node scripts/build-site.js --check
          node scripts/build-copy.js --check
      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'The figures are current.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=accuracy-figures
          checked=$(node -e "const c=require('./data/methods/certification.json');const d=Object.values(c).map(e=>e.checkedAt||'').sort().pop();console.log((d||'').slice(0,10))")
          git config user.name 'mihrab-dataset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$branch"
          git add -A data/methods docs fastlane README.md branding scripts/copy
          git commit -q -m "Accuracy figures: mihrab-methods' record as of ${checked:-today}"
          git push -q --force origin "$branch"
          {
            echo "mihrab-methods' certification record changed, so the figures the site, the README and the store listings quote change with it. Generated by \`.github/workflows/accuracy-figures.yml\`; review the numbers in the diff before merging."
            echo
            echo '```'
            git diff --stat HEAD~1 HEAD
            echo '```'
            echo
            echo "Checked in the job: \`build-site.js --check\` and \`build-copy.js --check\` (store limits, wording). CI does not start on its own for a pull request opened by a workflow; close and reopen it to run the full suite."
          } > body.md
          if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            gh pr edit "$branch" --body-file body.md
          else
            gh pr create --head "$branch" --base main --title "Accuracy figures: mihrab-methods' record as of ${checked:-today}" --body-file body.md
          fi
          echo "Pull request opened or refreshed for $branch." | tee -a "$GITHUB_STEP_SUMMARY"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Try Mihrab in your browser: prayer times, the Madinah muṣḥaf with tajwīd colours, four other riwāyāt, hard-word meanings and a recitation that follows word by word." />
    <meta name="theme-color" content="#0f3d33" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: blob:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Mihrab — demo</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0f3d33; }
      body { display: flex; flex-direction: column; overflow: hidden;
        font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #demo-bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 12px;
        padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top));
        color: #e8f1ee; background: #0f3d33; }
      #demo-bar a { color: #9fd9c6; text-decoration: none; font-weight: 600; }
      #demo-bar a:hover { text-decoration: underline; }
      #root { flex: 1; display: flex; min-height: 0; }
      #loading { margin: auto; color: #9fd9c6; }
    </style>
  </head>
  <body>
    <div id="demo-bar">
      <span>Mihrab demo — everything runs in your browser.</span>
      <a href="https://mihrab.elghamri.se/">Get the app →</a>
    </div>
    <div id="root"><div id="loading">Loading Mihrab…</div></div>
  </body>
</html>

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        // compileSdk 37 so the Android 17 Live Update APIs (MetricStyle,
        // Semantic Color, direct setRequestPromotedOngoing) compile. targetSdk
        // stays 36 to avoid unrelated API-37 behaviour changes for now.
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // The Compose compiler, for the Glance widgets only (docs/rewrite-plan.md,
        // Phase 4). Part of Kotlin since 2.0 and versioned with it; on the
        // classpath only when -PmihrabGlanceWidgets=true, so the default build
        // resolves nothing new. See android/app/build.gradle.
        if ((findProperty("mihrabGlanceWidgets") ?: "false").toString().toBoolean()) {
            classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

